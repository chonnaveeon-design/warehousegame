*{box-sizing:border-box}

const traitLevelTh = n => n >= 3 ? 'สูง' : n >= 1 ? 'ปานกลาง' : 'ต่ำ';

function analyzeTextRules(texts) {
  const joined = texts.filter(Boolean).join(' \n ');
  const traits = {};
  const dimBoost = {};
  TRAITS.forEach(t => {
    let hits = 0;
    texts.forEach(tx => { if (tx && t.re.test(tx)) hits++; });
    // also count multiple distinct matches in the joined text
    const global = new RegExp(t.re.source, 'gi');
    const all = (joined.match(global) || []).length;
    const score = Math.min(4, hits + Math.floor(all / 3));
    traits[t.key] = score;
    if (score > 0) Object.entries(t.dims).forEach(([d, w]) => { dimBoost[d] = (dimBoost[d] || 0) + w * Math.min(score, 3); });
  });
  return { traits, dimBoost, totalChars: joined.replace(/\s/g, '').length };
}

/* ---- Scoring ---- */
function scoreAnswers(answers) {
  const raw = Object.fromEntries(DIMS.map(d => [d.key, 0]));
  const add = (w, mult = 1) => { if (!w) return; Object.entries(w).forEach(([k, v]) => raw[k] += v * mult); };
  const a1 = answers.m1, a2 = answers.m2, a3 = answers.m3, a4 = answers.m4, a5 = answers.m5;
  if (a1?.ranking) a1.ranking.forEach((opt, i) => add(MISSION.m1.weights[opt], [3, 2, 1][i] || 1));
  if (a2?.first) add(MISSION.m2.weights[a2.first], 2);
  if (a2?.second) add(MISSION.m2.weights[a2.second], 1);
  if (a3?.choice) add(MISSION.m3.weights[a3.choice], 3);
  if (a4?.choices) a4.choices.forEach(c => add(MISSION.m4.weights[c], 2));
  if (a5?.roles) a5.roles.forEach(r => raw[r] += 4);

  // response time signal (seconds)
  const rts = ['m1', 'm2', 'm3', 'm4'].map(k => answers[k]?.responseTime).filter(v => typeof v === 'number');
  const median = rts.length ? rts.slice().sort((a, b) => a - b)[Math.floor(rts.length / 2)] : null;
  if (median !== null) {
    if (median < 20) { raw.ac += 2; raw.ld += .5; }
    else if (median > 60) { raw.dt += 1.5; raw.ps += 1; raw.pl += .5; }
  }
  // free-text rule signal (scaled down so choices remain primary)
  const texts = ['m1', 'm2', 'm3', 'm4', 'm5'].map(k => answers[k]?.text || '');
  const tx = analyzeTextRules(texts);
  Object.entries(tx.dimBoost).forEach(([k, v]) => raw[k] += v * .6);

  // consistency: same dim leading in >=3 missions
  const leaders = ['m1', 'm2', 'm3', 'm4'].map(k => {
    const m = MISSION[k]; let w = null;
    if (k === 'm1') w = MISSION.m1.weights[a1?.ranking?.[0]];
    if (k === 'm2') w = MISSION.m2.weights[a2?.first];
    if (k === 'm3') w = MISSION.m3.weights[a3?.choice];
    if (k === 'm4') w = MISSION.m4.weights[a4?.choices?.[0]];
    if (!w) return null;
    return Object.entries(w).sort((x, y) => y[1] - x[1])[0][0];
  }).filter(Boolean);
  const freq = {};
  leaders.forEach(l => freq[l] = (freq[l] || 0) + 1);
  Object.entries(freq).forEach(([k, n]) => { if (n >= 3) raw[k] += 2; });

  // normalise 0-100 against a practical maximum per dimension
  const MAX = { ps: 38, pl: 32, dt: 34, ac: 38, co: 38, pi: 30, ld: 32 };
  const scores = {};
  DIMS.forEach(d => scores[d.key] = Math.max(0, Math.min(100, Math.round(raw[d.key] / MAX[d.key] * 100))));
  return { scores, raw, median, textRules: tx };
}

function pickStyle(scores) {
  const sorted = DIMS.map(d => d.key).sort((a, b) => scores[b] - scores[a]);
  const top2 = sorted.slice(0, 2);
  const hit = STYLES.find(s => s.dims.every(d => top2.includes(d)));
  if (hit) return { ...hit, top: sorted };
  const a = DIM[top2[0]], b = DIM[top2[1]];
  return { dims: top2, name: `${a.name.split(' ')[0]} × ${b.name.split(' ')[0]}`, th: `คุณผสมจุดแข็งด้าน${a.th}เข้ากับ${b.th} ทำให้มองสถานการณ์ได้ทั้งสองมุม`, top: sorted };
}

function buildProfile(answers) {
  const { scores, median, textRules } = scoreAnswers(answers);
  const style = pickStyle(scores);
  const levels = Object.fromEntries(DIMS.map(d => [d.key, levelOf(scores[d.key]).key]));
  let achievements = ACHIEVEMENTS.filter(x => { try { return x.test(scores, answers, median, textRules); } catch (e) { return false; } }).map(x => x.key);
  if (achievements.length > 5) achievements = [...achievements.filter(k => k !== 'complete').slice(0, 4), 'complete'];
  return {
    scores, levels, style: { name: style.name, th: style.th, dims: style.dims },
    observations: buildObservations(answers, scores, textRules),
    dev: buildDevQuestion(scores),
    achievements, medianResponse: median,
    traits: textRules.traits,
    xp: Object.keys(answers).length * XP_PER_MISSION + achievements.length * 30,
  };
}

  if (strongTraits.length) parts.push(`จากเหตุผลที่เขียน พบรูปแบบ${strongTraits.slice(0, 3).join(', ')}`);
  if (profile.medianResponse !== null) parts.push(profile.medianResponse < 25 ? 'ตอบสนองต่อสถานการณ์ค่อนข้างเร็ว' : profile.medianResponse > 60 ? 'ใช้เวลาไตร่ตรองก่อนตอบ' : 'ใช้เวลาตัดสินใจในระดับปานกลาง');
  return {
    source: 'rules',
    summary: parts.join(' · '),
    traitLevels: Object.fromEntries(TRAITS.map(x => [x.key, traitLevelTh(t[x.key] || 0)])),
    strengths: top.slice(0, 3).map(k => DIM[k].name),
    develop: top.slice(-2).map(k => DIM[k].name),
    keyQuotes: ['m1', 'm2', 'm3', 'm4', 'm5'].map(k => answers[k]?.text).filter(x => x && x.length > 12).slice(0, 2),
    observations: profile.observations,
    devQuestion: profile.dev.question,
  };
}

/* ---- Memory store (demo / offline) ---- */
const MEM = { docs: new Map(), subs: [] };
function memNotify() { MEM.subs.forEach(s => { try { s.cb(memList(s.coll)); } catch (e) { } }); }
function memList(coll) { const out = []; MEM.docs.forEach((v, k) => { const i = k.lastIndexOf('/'); if (k.slice(0, i) === coll) out.push({ id: k.slice(i + 1), data: v }); }); return out; }

const Store = {
  real() { return !!CAP.db; },
  async get(path) {
    if (CAP.db) { const s = await CAP.db.doc(path).get(); return s.exists ? s.data() : null; }
    return MEM.docs.get(path) || null;
  },
  async set(path, data) {
    if (CAP.db) { await CAP.db.doc(path).set(data); return; }
    MEM.docs.set(path, JSON.parse(JSON.stringify(data))); memNotify();
  },
  async list(coll) {
    if (CAP.db) { const s = await CAP.db.collection(coll).get(); return s.docs.map(d => ({ id: d.id, data: d.data() })); }
    return memList(coll);
  },
  onList(coll, cb) {
    if (CAP.db) { return CAP.db.collection(coll).onSnapshot(s => cb(s.docs.map(d => ({ id: d.id, data: d.data() }))), e => console.warn('snapshot', e)); }
    const sub = { coll, cb }; MEM.subs.push(sub); setTimeout(() => cb(memList(coll)), 0);
    return () => { MEM.subs = MEM.subs.filter(x => x !== sub); };
  },
};

const Game = {
  code: null, name: '', emp: '', run: null, timer: null, t0: 0, sel: [], step: 'choice', pid: null,
  playerPath() { return 'players/' + this.pid; },
  async start(code, name, emp, sess) {
    this.code = code; this.name = name; this.emp = emp;
    this.pid = Store.real() ? CAP.uid : ('local-' + (lsGet('wsq_localid') || (() => { const v = Math.random().toString(36).slice(2, 10); lsSet('wsq_localid', v); return v; })()));
    const doc = await Store.get(this.playerPath());
    const existing = doc?.sessions?.[code];
    if (existing?.status === 'finished') { this.run = existing; lsSet('wsq_run', { code, name, emp }); go('result'); return; }
    this.run = existing || { name, employeeCode: emp, sessionName: sess.name, status: 'joined', mission: 0, answers: {}, startedAt: null, joinedAt: nowIso(), completedAt: null, profile: null, ai: null };
    this.run.name = name; this.run.employeeCode = emp; this.run.lastSeen = nowIso();
    await this.save();
    lsSet('wsq_run', { code, name, emp });
    if (this.run.status === 'joined') viewConsent(); else go('play');
  },
  async save() {
    const doc = (await Store.get(this.playerPath())) || {};
    const sessions = { ...(doc.sessions || {}) };
    sessions[this.code] = this.run;
    await Store.set(this.playerPath(), { name: this.name, employeeCode: this.emp, updatedAt: nowIso(), sessions });
  },
  async resume() {
    const saved = lsGet('wsq_run'); if (!saved) { go('join'); return false; }
    await waitCaps();
    if (!this.run || this.code !== saved.code) {
      this.code = saved.code; this.name = saved.name; this.emp = saved.emp;
      this.pid = Store.real() ? CAP.uid : ('local-' + lsGet('wsq_localid'));
      if (!this.pid) { go('join'); return false; }
      const doc = await Store.get(this.playerPath());
      this.run = doc?.sessions?.[saved.code] || null;
      if (!this.run) { lsDel('wsq_run'); go('join'); return false; }
    }
    return true;
  },
};

function optButton(k, label, extra = '') { return `<button class="opt" data-k="${k}" id="opt_${k}"><span class="key">${k}</span><span>${esc(label)}</span>${extra}</button>`; }

function renderChoiceStage(m, idx) {
  const st = $('#stage');
  const opts = m.options ? Object.entries(m.options) : [];
  let html = `<h3>${esc(m.question)}</h3>`;
  if (m.type === 'roles2') {
    html += `<div class="stack-sm">${m.roles.map(r => `<button class="role" data-k="${r.key}" id="role_${r.key}"><span class="emo">${r.emo}</span><div><b>${r.emo === '👑' ? '' : ''}${esc(r.name)}</b><span>${esc(r.desc)}</span></div></button>`).join('')}</div>`;
  } else if (m.type === 'first2') {
    html += `<div class="stack-sm" id="grpA">${opts.map(([k, v]) => optButton(k, v)).join('')}</div>
      <div id="second" class="stack-sm hidden"><h3 style="margin-top:.5rem">${esc(m.question2)}</h3><div class="stack-sm" id="grpB">${opts.map(([k, v]) => optButton(k, v)).join('')}</div></div>`;
  } else {
    html += `<div class="stack-sm">${opts.map(([k, v]) => optButton(k, v, '<span class="rank"></span>')).join('')}</div>`;
  }
  html += `<p class="small muted" id="hint"></p><button class="btn-primary" id="nextBtn" disabled>ยืนยันคำตอบ →</button>`;
  st.innerHTML = html;
  const next = $('#nextBtn'), hint = $('#hint');
  const limit = { rank3: 3, multi2: 2, roles2: 2, single: 1 }[m.type];

  if (m.type === 'first2') {
    let first = null, second = null;
    $$('#grpA .opt').forEach(b => b.onclick = () => { first = b.dataset.k; $$('#grpA .opt').forEach(x => x.classList.toggle('on', x === b)); $('#second').classList.remove('hidden'); $$('#grpB .opt').forEach(x => { x.disabled = x.dataset.k === first; if (x.dataset.k === first) x.classList.remove('on'); }); if (second === first) second = null; next.disabled = !(first && second); });
    $$('#grpB .opt').forEach(b => b.onclick = () => { second = b.dataset.k; $$('#grpB .opt').forEach(x => x.classList.toggle('on', x === b)); next.disabled = !(first && second); });
    next.onclick = () => saveChoice(m, idx, { first, second });
    return;
  }
  const sel = [];
  const refresh = () => {
    $$('.opt,.role', st).forEach(b => { const i = sel.indexOf(b.dataset.k); b.classList.toggle('on', i >= 0); const r = b.querySelector('.rank'); if (r) r.textContent = i >= 0 && m.type === 'rank3' ? (i + 1) : ''; });
    hint.textContent = m.type === 'rank3' ? `เลือกแล้ว ${sel.length}/3 · กดซ้ำเพื่อยกเลิก` : m.type === 'single' ? '' : `เลือกแล้ว ${sel.length}/${limit}`;
    next.disabled = m.type === 'single' ? sel.length !== 1 : m.type === 'multi2' ? sel.length < 1 : sel.length !== limit;
  };
  $$('.opt,.role', st).forEach(b => b.onclick = () => {
    const k = b.dataset.k; const i = sel.indexOf(k);
    if (i >= 0) sel.splice(i, 1);
    else { if (m.type === 'single') sel.length = 0; if (sel.length < limit) sel.push(k); else if (m.type !== 'rank3') { sel.shift(); sel.push(k); } }
    refresh();
  });
  refresh();
  next.onclick = () => {
    if (m.type === 'rank3') saveChoice(m, idx, { ranking: [...sel] });
    else if (m.type === 'single') saveChoice(m, idx, { choice: sel[0] });
    else if (m.type === 'multi2') saveChoice(m, idx, { choices: [...sel] });
    else saveChoice(m, idx, { roles: [...sel] });
  };
}

function saveChoice(m, idx, choice) {
  const rt = Math.round((Date.now() - Game.t0) / 1000);
  Game.pending = { ...choice, responseTime: rt, choiceAt: nowIso() };

}

function answersToText(answers) {
  return MISSIONS.map(m => {
    const a = answers[m.id]; if (!a) return '';
    const pick = a.ranking ? a.ranking.map((k, i) => `${i + 1}) ${m.options[k]}`).join(' | ') : a.first ? `first: ${m.options[a.first]} | second: ${m.options[a.second]}` : a.choice ? m.options[a.choice] : a.choices ? a.choices.map(k => m.options[k]).join(' | ') : a.roles ? a.roles.map(k => DIM[k].name).join(' | ') : '';
    return `${m.code} ${m.title}\nสถานการณ์: ${m.scene}\nเลือก: ${pick}\nเวลาตอบ: ${a.responseTime ?? '-'}s\nคำถาม: ${m.free}\nเหตุผลที่เขียน: "${a.text || ''}"`;
  }).filter(Boolean).join('\n\n');
}

คำตอบของผู้เล่น "${run.name}":
${answersToText(run.answers)}

ตอบเป็น JSON เท่านั้น (ภาษาไทย ยกเว้น key) ตามโครงนี้:
{"summary":"สรุป 2-3 ประโยค เริ่มด้วย 'ผู้เล่นคนนี้มีแนวโน้ม…'",
 "traitLevels":{"reasoning":"สูง|ปานกลาง|ต่ำ","root_cause":"…","priority":"…","risk":"…","communication":"…","systems":"…","pressure_decision":"…","people":"…","improvement":"…","data":"…"},

 "adjust":{"ps":0,"pl":0,"dt":0,"ac":0,"co":0,"pi":0,"ld":0}}
"adjust" = ปรับคะแนนจากหลักฐานใน free text เท่านั้น ช่วง -12 ถึง +12 ต่อมิติ (0 ถ้าไม่มีหลักฐาน)`;
  const res = await CAP.sample.json(prompt, { modelTier: 'default', onText: onText ? ({ text }) => onText(text) : undefined });

async function applyAiToRun(run, ai) {
  const base = run.profile.baseScores || run.profile.scores;
  const scores = { ...base };
  if (ai.adjust) DIMS.forEach(d => { const v = Number(ai.adjust[d.key]) || 0; scores[d.key] = Math.max(0, Math.min(100, Math.round(base[d.key] + Math.max(-12, Math.min(12, v))))); });
  run.profile.scores = scores;
  run.profile.levels = Object.fromEntries(DIMS.map(d => [d.key, levelOf(scores[d.key]).key]));
  const st = pickStyle(scores); run.profile.style = { name: st.name, th: st.th, dims: st.dims };
  if (Array.isArray(ai.observations) && ai.observations.length) run.profile.observations = ai.observations.slice(0, 3);
  if (ai.devQuestion) run.profile.dev = { dim: (ai.develop || [])[0] || run.profile.dev.dim, question: ai.devQuestion };
  run.ai = { source: 'claude', at: nowIso(), summary: ai.summary || '', traitLevels: ai.traitLevels || {}, strengths: (ai.strengths || []).map(k => DIM[k]?.name || k), develop: (ai.develop || []).map(k => DIM[k]?.name || k), keyQuotes: ai.keyQuotes || [], observations: run.profile.observations, devQuestion: run.profile.dev.question, adjust: ai.adjust || {} };
}

/* ===================== Result ===================== */
function radarSvg(scoreSets, size = 300) {
  // scoreSets: [{scores, color, fill}] – single scale 0..100
  const c = size / 2, r = size / 2 - 64, n = DIMS.length;
  const pt = (i, v) => { const a = -Math.PI / 2 + i * 2 * Math.PI / n; return [c + Math.cos(a) * r * v / 100, c + Math.sin(a) * r * v / 100]; };
  let g = '';
  [25, 50, 75, 100].forEach(v => { g += `<polygon points="${DIMS.map((_, i) => pt(i, v).join(',')).join(' ')}" fill="none" stroke="var(--line)" stroke-width="1"/>`; });
  DIMS.forEach((_, i) => { const [x, y] = pt(i, 100); g += `<line x1="${c}" y1="${c}" x2="${x}" y2="${y}" stroke="var(--line)" stroke-width="1"/>`; });
  scoreSets.forEach(s => {
    const pts = DIMS.map((d, i) => pt(i, s.scores[d.key] || 0));
    g += `<polygon points="${pts.map(p => p.join(',')).join(' ')}" fill="${s.color}" fill-opacity=".18" stroke="${s.color}" stroke-width="2" stroke-linejoin="round"/>`;
    pts.forEach(p => g += `<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="${s.color}" stroke="var(--card)" stroke-width="2"/>`);
  });
  DIMS.forEach((d, i) => { const [x, y] = pt(i, 118); const anchor = Math.abs(x - c) < 10 ? 'middle' : x > c ? 'start' : 'end'; g += `<text x="${x}" y="${y + 4}" text-anchor="${anchor}" font-size="11" font-family="Kanit, Noto Sans Thai, sans-serif" fill="var(--ink2)">${d.emo} ${d.name.split(' ')[0]}</text>`; });
  return `<svg viewBox="0 0 ${size} ${size}" width="100%" style="max-width:${size + 40}px;display:block;margin:0 auto;overflow:visible" role="img" aria-label="Radar chart of 7 strength dimensions">${g}</svg>`;
}

function dimBars(scores, showLevel = true) {
  return DIMS.map(d => { const v = scores[d.key] || 0, lv = levelOf(v); return `<div class="dim-row"><span title="${d.name}">${d.emo}</span><div><div class="row spread small" style="margin-bottom:.2rem"><b>${d.name}</b>${showLevel ? `<span class="pill ${lv.color}">${lv.th}</span>` : `<span class="mono small">${v}</span>`}</div><div class="bar"><i style="width:${v}%;background:var(--${d.key})"></i></div></div></div>`; }).join('');
}

async function runAiForSelf(btn) {
  const run = Game.run; run.aiTried = true;
  if (btn) { btn.disabled = true; btn.textContent = 'AI กำลังอ่านเหตุผลของคุณ…'; }
  const tag = $('#aiTag'); if (tag) tag.textContent = '🤖 กำลังวิเคราะห์…';
  try {
    const ai = await aiAnalyzePlayer(run);
    if (ai && typeof ai === 'object') { await applyAiToRun(run, ai); await Game.save(); toast('อัปเดตผลวิเคราะห์จาก AI แล้ว'); viewResult(); return; }
    throw new Error('empty');
  } catch (e) {
    console.warn('AI unavailable', e);
    if (tag) tag.textContent = '📐 วิเคราะห์จากรูปแบบคำตอบ';

    if (e?.code === 'not_granted' && btn) btn.remove();
  }
}

    await Store.set('sessions/' + code, MG.session);

  };
  $$('#tabs button').forEach(b => b.onclick = () => { MG.tab = b.dataset.tab; $$('#tabs button').forEach(x => x.classList.toggle('on', x === b)); MG.selected = null; renderTab(); });
  const unsub = Store.onList('players', docs => { MG.entries = collectEntries(docs, code); renderTab(); });
  unsubs.push(unsub);
}

function teamStats() {
  const F = finished();
  const avg = {}, strong = {}, sd = {};
  DIMS.forEach(d => {
    const vals = F.map(e => e.profile.scores[d.key] || 0);
    const m = vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : 0;
    avg[d.key] = Math.round(m);
    strong[d.key] = vals.filter(v => v >= 50).length;
    sd[d.key] = vals.length ? Math.round(Math.sqrt(vals.reduce((a, v) => a + (v - m) ** 2, 0) / vals.length)) : 0;
  });
  const keys = DIMS.map(d => d.key);
  const common = keys.filter(k => F.length && strong[k] >= Math.ceil(F.length / 2)).sort((a, b) => strong[b] - strong[a]);
  const diverse = keys.slice().sort((a, b) => sd[b] - sd[a]).slice(0, 2).filter(k => sd[k] >= 15);
  const develop = keys.slice().sort((a, b) => avg[a] - avg[b]).slice(0, 2);
  return { F, avg, strong, sd, common, diverse, develop };
}

/* ---- Talent map ---- */
function renderTalentMap(body) {
  const F = finished();
  const size = 560, c = size / 2, R = size / 2 - 70;
  const anchor = i => { const a = -Math.PI / 2 + i * 2 * Math.PI / DIMS.length; return [c + Math.cos(a) * R, c + Math.sin(a) * R]; };
  let g = `<circle cx="${c}" cy="${c}" r="${R}" fill="none" stroke="var(--line)"/><circle cx="${c}" cy="${c}" r="${R * .5}" fill="none" stroke="var(--line)" stroke-dasharray="4 4"/>`;
  DIMS.forEach((d, i) => { const [x, y] = anchor(i); g += `<line x1="${c}" y1="${c}" x2="${x}" y2="${y}" stroke="var(--line)"/><circle cx="${x}" cy="${y}" r="16" fill="var(--${d.key})" opacity=".9"/><text x="${x}" y="${y + 5}" text-anchor="middle" font-size="14">${d.emo}</text>`; const lx = c + (x - c) * 1.22, ly = c + (y - c) * 1.22; g += `<text x="${lx}" y="${ly + 4}" text-anchor="middle" font-size="12" font-family="Kanit, sans-serif" fill="var(--ink2)">${d.name.split(' ')[0]}</text>`; });
  const pts = F.map((e, idx) => {
    let sx = 0, sy = 0, sw = 0;
    DIMS.forEach((d, i) => { const w = Math.pow((e.profile.scores[d.key] || 0) / 100, 3); const [x, y] = anchor(i); sx += (x - c) * w; sy += (y - c) * w; sw += w; });
    let px = sw ? sx / sw * 1.7 : 0, py = sw ? sy / sw * 1.7 : 0;
    const len = Math.hypot(px, py), max = R * .72; if (len > max) { px *= max / len; py *= max / len; }
    const j = (idx * 137.5) % 360 * Math.PI / 180; px += Math.cos(j) * 14; py += Math.sin(j) * 14;
    const top = DIMS.slice().sort((a, b) => e.profile.scores[b.key] - e.profile.scores[a.key])[0].key;
    return { e, x: c + px, y: c + py, top };
  });
  pts.forEach(p => { g += `<g class="tp" data-pid="${esc(p.e.pid)}" style="cursor:pointer"><circle cx="${p.x}" cy="${p.y}" r="13" fill="var(--${p.top})" stroke="var(--card)" stroke-width="3"/><text x="${p.x}" y="${p.y + 26}" text-anchor="middle" font-size="12" font-family="Noto Sans Thai, sans-serif" fill="var(--ink)">${esc(p.e.name)}</text></g>`; });
  body.innerHTML = `<div class="card stack-sm">
    <div class="row spread"><h3>Team Talent Map</h3><span class="small muted">${F.length} คน · กดที่ชื่อเพื่อดูรายละเอียด</span></div>
    <p class="small muted">แต่ละคนถูกวางตามแนวโน้มจุดแข็ง (ใกล้มิติที่เด่น) สีของจุด = มิติที่เด่นที่สุด แผนที่นี้ใช้เพื่อเห็น "ความหลากหลายของจุดแข็งในทีม" ไม่ใช่การจัดอันดับ</p>
    ${F.length ? `<svg class="tmap" viewBox="0 0 ${size} ${size}" role="img" aria-label="Team talent map">${g}</svg>` : '<p class="muted small">ยังไม่มีผู้เล่นที่เล่นจบ</p>'}
    <div class="legend">${DIMS.map(d => `<span><i style="background:var(--${d.key})"></i>${d.name}</span>`).join('')}</div>
  </div>`;
  $$('.tp', body).forEach(gp => gp.onclick = () => { MG.selected = gp.dataset.pid; renderTab(); });
}

/* ---- Team insight ---- */
function rulesTeamInsight() {
  const { F, avg, strong, sd, common, diverse, develop } = teamStats();
  const ins = [], qs = [];
  if (!F.length) return { source: 'rules', insights: ['ยังไม่มีข้อมูลเพียงพอ'], questions: [] };
  if (common.length) ins.push(`ทีมนี้มีสมาชิกหลายคนที่มีแนวโน้มด้าน ${common.slice(0, 2).map(k => DIM[k].name).join(' และ ')}`);
  if (diverse.length) ins.push(`มีความหลากหลายด้าน ${diverse.map(k => DIM[k].name).join(' และ ')} — สมาชิกบางคนเด่นมาก บางคนยังเป็น Emerging ซึ่งเป็นโอกาสในการจับคู่เรียนรู้กัน`);
  const m2 = {}; F.forEach(e => { const f = e.answers?.m2?.first; if (f) m2[f] = (m2[f] || 0) + 1; });
  const m2keys = Object.keys(m2);
  if (m2keys.length >= 2) ins.push(`จากคำตอบของสมาชิกหลายคน พบรูปแบบการตัดสินใจที่แตกต่างกันในสถานการณ์ SKU Missing: ${m2keys.map(k => `${m2[k]} คนเลือก "${MISSION.m2.options[k]}"`).join(', ')}`);
  else if (m2keys.length === 1) ins.push(`ในสถานการณ์ SKU Missing ทุกคนเลือกเริ่มจาก "${MISSION.m2.options[m2keys[0]]}" — ทีมมีรูปแบบการคิดที่คล้ายกัน อาจลองถามว่ามีมุมอื่นที่ควรพิจารณาไหม`);
  const m3 = {}; F.forEach(e => { const f = e.answers?.m3?.choice; if (f) m3[f] = (m3[f] || 0) + 1; });
  const lead = (m3.B || 0) + (m3.E || 0);
  if (lead) ins.push(`เมื่อหัวหน้าไม่อยู่ ${lead}/${F.length} คนพร้อมก้าวออกมาจัดทีม (เลือกแบ่งงานหรือเรียกทีมคุย)`);
  ins.push(`มิติที่ทีมอาจต้องพัฒนาร่วมกัน: ${develop.map(k => `${DIM[k].name} (เฉลี่ย ${avg[k]})`).join(', ')}`);
  qs.push('เมื่อเกิดปัญหาเร่งด่วน ทีมของเราควรตัดสินใจก่อน หรือเก็บข้อมูลก่อน? และใครควรเป็นคนตัดสิน?');
  if (strong.pi) qs.push(`เราสามารถใช้คนที่ถนัด Process Improvement (${strong.pi} คน) มาช่วยลดปัญหา Packing Error ได้อย่างไร?`);
  if (develop.includes('co')) qs.push('ในวันที่งานหนัก เราจะสื่อสารสถานะกันอย่างไรให้ทุกคนเห็นภาพเดียวกัน?');

  return { source: 'rules', insights: ins, questions: qs.slice(0, 4), at: nowIso() };

const csvCell = v => { const s = String(v ?? '').replace(/"/g, '""'); return /[",\n\r]/.test(s) ? `"${s}"` : s; };
const toCsv = rows => '﻿' + rows.map(r => r.map(csvCell).join(',')).join('\r\n');
const lvTh = v => levelOf(v || 0).th;
const answerPlain = (m, a) => answerSummary(m, a).replace(/<br>/g, ' / ').replace(/<[^>]+>/g, '').replace(/&amp;/g, '&');

function csvIndividual(e) {
  const p = e.profile || {}; const rows = [['Field', 'Value'], ['Session', MG.session.name], ['Game Code', MG.code], ['Player', e.name], ['Employee Code', e.employeeCode], ['Status', e.status], ['Joined', e.joinedAt], ['Completed', e.completedAt], ['Work Style', p.style?.name], ['Style Description', p.style?.th]];
  DIMS.forEach(d => rows.push([d.name, p.scores ? `${p.scores[d.key]} (${lvTh(p.scores[d.key])})` : '']));
  rows.push(['AI Source', e.ai?.source], ['AI Summary', e.ai?.summary], ['Strengths', (e.ai?.strengths || []).join('; ')], ['Develop', (e.ai?.develop || []).join('; ')], ['Observations', (p.observations || []).join(' | ')], ['Development Question', p.dev?.question], ['Achievements', (p.achievements || []).map(k => ACHIEVEMENTS.find(a => a.key === k)?.name).join('; ')]);
  MISSIONS.forEach(m => { const a = e.answers?.[m.id]; rows.push([`${m.code} choice`, answerPlain(m, a)], [`${m.code} response time (s)`, a?.responseTime], [`${m.code} reason`, a?.text]); });
  return toCsv(rows);
}
function csvTeam() {
  const head = ['Player', 'Employee Code', 'Status', ...DIMS.map(d => d.name), 'Work Style', 'Strength Profile', ...MISSIONS.map(m => m.code + ' response'), ...MISSIONS.map(m => m.code + ' reason'), 'AI Summary', 'AI Source', 'Development Question'];
  const rows = [head];
  MG.entries.forEach(e => { const p = e.profile || {}; rows.push([e.name, e.employeeCode, e.status, ...DIMS.map(d => p.scores ? p.scores[d.key] : ''), p.style?.name || '', p.scores ? DIMS.map(d => `${d.name}: ${lvTh(p.scores[d.key])}`).join('; ') : '', ...MISSIONS.map(m => answerPlain(m, e.answers?.[m.id])), ...MISSIONS.map(m => e.answers?.[m.id]?.text || ''), e.ai?.summary || '', e.ai?.source || '', p.dev?.question || '']); });
  return toCsv(rows);
}
function csvRaw() {
  const rows = [['player_id', 'player', 'employee_code', 'mission_id', 'question_id', 'answer', 'ranking', 'response_time_s', 'text_time_s', 'created_at']];
  MG.entries.forEach(e => MISSIONS.forEach(m => { const a = e.answers?.[m.id]; if (!a) return;
    if (a.ranking) rows.push([e.pid, e.name, e.employeeCode, m.id, 'rank3', a.ranking.join('>'), a.ranking.join('>'), a.responseTime, '', a.choiceAt]);
    if (a.first) { rows.push([e.pid, e.name, e.employeeCode, m.id, 'first', a.first, 1, a.responseTime, '', a.choiceAt]); rows.push([e.pid, e.name, e.employeeCode, m.id, 'second', a.second, 2, a.responseTime, '', a.choiceAt]); }
    if (a.choice) rows.push([e.pid, e.name, e.employeeCode, m.id, 'single', a.choice, '', a.responseTime, '', a.choiceAt]);
    if (a.choices) rows.push([e.pid, e.name, e.employeeCode, m.id, 'multi', a.choices.join('+'), '', a.responseTime, '', a.choiceAt]);
    if (a.roles) rows.push([e.pid, e.name, e.employeeCode, m.id, 'roles', a.roles.join('+'), '', a.responseTime, '', a.choiceAt]);
    rows.push([e.pid, e.name, e.employeeCode, m.id, 'free_text', a.text || '', '', '', a.textTime, a.createdAt]);
  }));
  return toCsv(rows);
}
function csvAI() {
  const rows = [['player_id', 'player', 'dimension', 'score', 'level', 'explanation', 'ai_source']];
  MG.entries.filter(e => e.profile).forEach(e => { DIMS.forEach(d => rows.push([e.pid, e.name, d.name, e.profile.scores[d.key], lvTh(e.profile.scores[d.key]), e.ai?.traitLevels ? TRAITS.filter(t => t.dims[d.key]).map(t => `${t.th}: ${e.ai.traitLevels[t.key] || '-'}`).join('; ') : '', e.ai?.source])); rows.push([e.pid, e.name, 'SUMMARY', '', '', e.ai?.summary || '', e.ai?.source]); });
  return toCsv(rows);
}
async function deliverCsv(filename, data) {
  if (CAP.downloads) { try { await CAP.downloads.save({ filename, data }); toast('บันทึกไฟล์แล้ว'); return; } catch (e) { if (e?.code === 'declined') return; console.warn(e); } }
  // fallback: show text to copy
  const body = $('#tabBody');
  const box = document.createElement('div'); box.className = 'card stack-sm';
  box.innerHTML = `<div class="row spread"><b>${esc(filename)}</b><button class="btn-sm btn-ghost" id="closeCsv">ปิด</button></div><p class="small muted">การดาวน์โหลดไฟล์ไม่พร้อมใช้งานในมุมมองนี้ คัดลอกข้อความด้านล่างไปวางใน Excel / Google Sheets แทน</p><textarea class="mono small" style="min-height:200px" readonly id="csvText"></textarea><button class="btn-navy btn-sm" id="copyCsv">คัดลอกทั้งหมด</button>`;
  body.prepend(box); $('#csvText').value = data;
  $('#closeCsv').onclick = () => box.remove();
  $('#copyCsv').onclick = async () => { try { await navigator.clipboard.writeText(data); toast('คัดลอกแล้ว'); } catch (e) { $('#csvText').select(); toast('เลือกข้อความแล้ว กด Ctrl/Cmd+C'); } };
}

function seedDemoIntoMemory() {
  if (MEM.docs.size) return;

  Object.entries(d.sessions).forEach(([k, v]) => MEM.docs.set('sessions/' + k, v));
  Object.entries(d.players).forEach(([k, v]) => MEM.docs.set('players/' + k, v));
}
